name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Install latest mdbook
        run: gh release download -p 'mdbook-*-x86_64-unknown-linux-gnu.tar.gz' -O- | tar xvz -C $RUNNER_TOOL_CACHE
        env:
          GH_REPO: rust-lang/mdbook
          GH_TOKEN: ${{github.token}}
      - name: Build book
        run: $RUNNER_TOOL_CACHE/mdbook build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: book
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
